<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnages One Piece</title>
    <script src="personnages.js" defer></script>
</head>
<body>
    <h1>API des Personnages One Piece</h1>
    <button onclick="recupererPersonnages()">Récupérer tous les personnages</button>
    <button onclick="recupererPersonnageParId(1)">Récupérer le personnage ID 1</button>
    <input type="text" id="searchQuery" placeholder="Rechercher des personnages...">
    <button onclick="rechercherPersonnages(document.getElementById('searchQuery').value)">Rechercher</button>
    <button onclick="recupererPersonnagesEquipage(1)">Récupérer personnages de l'équipage ID 1</button>
    <button onclick="recupererNombrePersonnagesEquipage(1)">Nombre de personnages dans l'équipage ID 1</button>
</body>
</html>
